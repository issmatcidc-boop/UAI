  <!-- Persecución: misma silueta, gesto intenso y estela naranja -->
  <g transform="translate(0 128)"><path d="M2 27h5v3H2zM5 34h4v2H5z" fill="#ffb34d"/><use href="#body" transform="rotate(-3 32 32)"/><use href="#badge"/></g>
  <g transform="translate(64 128)"><path d="M1 25h7v3H1zM4 34h5v2H4z" fill="#ffb34d"/><use href="#body" transform="translate(1 0) rotate(-2 32 32)"/><use href="#badge" transform="translate(1 0)"/><path d="M20 23h7v3h-7zM41 23h7v3h-7z" fill="#fff7ce"/></g>
  <g transform="translate(128 128)"><path d="M0 30h7v3H0zM4 39h5v2H4z" fill="#ffb34d"/><use href="#body" transform="rotate(2 32 32)"/><use href="#badge"/><path d="M20 23h7v3h-7zM41 23h7v3h-7z" fill="#fff7ce"/></g>
  <g transform="translate(192 128)"><path d="M1 26h7v3H1zM4 36h5v2H4z" fill="#ffb34d"/><use href="#body" transform="translate(-1 0) rotate(3 32 32)"/><use href="#badge" transform="translate(-1 0)"/><path d="M20 23h7v3h-7zM41 23h7v3h-7z" fill="#fff7ce"/></g>
  <!-- Aturdido / recuperación -->
  <g transform="translate(0 192)"><use href="#body"/><use href="#badge"/><use href="#stun-stars"/><path d="M24 23h5v3h-5zM39 23h5v3h-5z" fill="#fff0a4"/></g>
  <g transform="translate(64 192)"><use href="#body" transform="translate(1 -1)"/><use href="#badge" transform="translate(1 -1)"/><use href="#stun-stars" transform="translate(1 1)"/><path d="M24 23h5v3h-5zM39 23h5v3h-5z" fill="#fff0a4"/></g>
  <g transform="translate(128 192)"><use href="#body"/><use href="#badge"/><use href="#stun-stars" transform="translate(-1 0)"/><path d="M24 23h5v3h-5zM39 23h5v3h-5z" fill="#fff0a4"/></g>
  <g transform="translate(192 192)"><use href="#body" transform="translate(-1 1)"/><use href="#badge" transform="translate(-1 1)"/><use href="#stun-stars" transform="translate(0 -1)"/><path d="M24 23h5v3h-5zM39 23h5v3h-5z" fill="#fff0a4"/></g>
</svg>
