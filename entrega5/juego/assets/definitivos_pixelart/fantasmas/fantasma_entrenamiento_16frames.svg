      <path d="M51 20h3v3h3v3h-3v4h-3v-4h-3v-3h3z"/>
      <path d="M14 43h2v2h2v2h-2v3h-2v-3h-2v-2h2z"/>
    </g>
  </defs>
  <!-- Espera / flotación -->
  <g transform="translate(0 0)"><use href="#body"/><use href="#badge"/><path d="M17 60h30v2H17z" fill="#f4ca62" opacity=".55"/></g>
  <g transform="translate(64 0)"><use href="#body" transform="translate(0 -1)"/><use href="#badge" transform="translate(0 -1)"/><path d="M17 59h30v2H17z" fill="#f4ca62" opacity=".5"/></g>
  <g transform="translate(128 0)"><use href="#body"/><use href="#badge"/><path d="M17 60h30v2H17z" fill="#f4ca62" opacity=".55"/></g>
  <g transform="translate(192 0)"><use href="#body" transform="translate(0 1)"/><use href="#badge" transform="translate(0 1)"/><path d="M17 61h30v2H17z" fill="#f4ca62" opacity=".5"/></g>
  <!-- Patrulla -->
  <g transform="translate(0 64)"><use href="#body"/><use href="#badge"/><path d="M7 34h5v5H7zM54 31h5v5h-5z" fill="#fff0a4"/></g>
