  <g transform="translate(64 192)"><use href="#body" transform="translate(1 -1)"/><use href="#portrait-mark" transform="translate(1 -1)"/><use href="#stun-stars" transform="translate(1 1)"/><path d="M24 23h5v3h-5zM39 23h5v3h-5z" fill="#65d8ce"/></g>
  <g transform="translate(128 192)"><use href="#body"/><use href="#portrait-mark"/><use href="#stun-stars" transform="translate(-1 0)"/><path d="M24 23h5v3h-5zM39 23h5v3h-5z" fill="#65d8ce"/></g>
  <g transform="translate(192 192)"><use href="#body" transform="translate(-1 1)"/><use href="#portrait-mark" transform="translate(-1 1)"/><use href="#stun-stars" transform="translate(0 -1)"/><path d="M24 23h5v3h-5zM39 23h5v3h-5z" fill="#65d8ce"/></g>
</svg>
