  <g transform="translate(128 64)"><use href="#body"/><use href="#portrait-mark"/><path d="M7 31h5v5H7zM54 35h5v5h-5z" fill="#75d6d2"/></g>
  <g transform="translate(192 64)"><use href="#body" transform="translate(-1 0)"/><use href="#portrait-mark" transform="translate(-1 0)"/><path d="M8 34h5v5H8zM53 32h5v5h-5z" fill="#75d6d2"/></g>
  <!-- Persecución: manto inclinado, ojos encendidos y estela -->
  <g transform="translate(0 128)"><path d="M2 27h5v3H2zM5 34h4v2H5z" fill="#65c9d1"/><use href="#body" transform="rotate(-3 32 32)"/><use href="#portrait-mark"/></g>
  <g transform="translate(64 128)"><path d="M1 25h7v3H1zM4 34h5v2H4z" fill="#65c9d1"/><use href="#body" transform="translate(1 0) rotate(-2 32 32)"/><use href="#portrait-mark" transform="translate(1 0)"/><path d="M20 21h7v3h-7zM41 20h7v3h-7z" fill="#fff0ae"/></g>
  <g transform="translate(128 128)"><path d="M0 30h7v3H0zM4 39h5v2H4z" fill="#65c9d1"/><use href="#body" transform="rotate(2 32 32)"/><use href="#portrait-mark"/><path d="M20 21h7v3h-7zM41 20h7v3h-7z" fill="#fff0ae"/></g>
  <g transform="translate(192 128)"><path d="M1 26h7v3H1zM4 36h5v2H4z" fill="#65c9d1"/><use href="#body" transform="translate(-1 0) rotate(3 32 32)"/><use href="#portrait-mark" transform="translate(-1 0)"/><path d="M20 21h7v3h-7zM41 20h7v3h-7z" fill="#fff0ae"/></g>
  <!-- Aturdido -->
