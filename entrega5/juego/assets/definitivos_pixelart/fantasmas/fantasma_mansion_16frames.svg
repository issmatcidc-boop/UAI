      <path d="M20 5h23v3h5v4h5v8h4v13h4v13h-5v7h-5v7h-7v5h-6v-7h-4v5h-6v-5h-5v5h-6v-8h-5v-8h-4v-9h-4V25h4v-7h4v-5h4v-5h4z" fill="#e8e0cb"/>
      <path d="M19 10h5v-3h18v4h5v5h4v10h4v9h-5v8h-4v7h-5v6h-5v-7h-5v5h-5v-5h-5v4h-4v-8h-4v-8h-4V27h4v-7h4v-5h4z" fill="#c7c3bc"/>
      <path d="M17 20h4v-5h5v-4h13v4h6v5h4v8H17z" fill="#706a79"/>
      <path d="M20 19h7v-3h5v4h-4v3h-8zM37 17h6v3h4v4h-8v-3h-3z" fill="#958a91"/>
      <path d="M19 22h10v3h-5v3h-5zM39 21h10v4h-5v3h-5z" fill="#17142a"/>
      <path d="M21 22h5v3h-5zM41 21h5v3h-5z" fill="#ffd56d"/>
      <path d="M30 25h8v3h-3v2h-4v-2h-3v-2h2z" fill="#33253c"/>
      <path d="M33 27h3v2h-3z" fill="#ff845c"/>
      <path d="M12 34h6v4h4v7h-5v-3h-5zM48 33h6v7h-4v5h-5v-7h3z" fill="#bdb8b4"/>
      <path d="M9 38h5v5h5v4h-8v-3H9zM49 39h6v5h-4v4h-6v-5h4z" fill="#7d7882"/>
      <path d="M22 35h3v4h-3zM41 34h3v5h-3zM29 38h3v3h-3z" fill="#9d9697"/>
      <path d="M14 49h5v6h5v3h-6v-3h-4zM44 48h5v6h-4v4h-7v-3h5z" fill="#aaa4a6"/>
      <path d="M11 46h4v3h-4zM50 45h5v4h-5zM23 53h4v4h-4zM34 55h4v4h-4z" fill="#50c8c8"/>
      <path d="M24 11h2v5h-2zM45 14h2v4h-2zM12 29h3v2h-3z" fill="#f7ecd2"/>
      <path d="M27 32h3v2h-3zM36 32h3v2h-3z" fill="#5b5067"/>
      <path d="M28 9h3v2h-3zM18 42h2v3h-2zM43 45h2v3h-2z" fill="#eee9de"/>
    </g>
    <g id="portrait-mark">
      <path d="M29 43h7v2h-7zM28 45h9v3h-9z" fill="#d39a45"/>
      <path d="M30 44h5v2h-5z" fill="#273c47"/>
