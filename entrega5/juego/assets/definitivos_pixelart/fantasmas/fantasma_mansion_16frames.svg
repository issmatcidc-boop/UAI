<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" shape-rendering="crispEdges">
  <title>Fantasma del retrato · hoja de 16 fotogramas</title>
  <desc>Pixel art transparente. Cuatro filas: espera, patrulla, persecución y aturdido; cuatro frames por fila.</desc>
  <defs>
