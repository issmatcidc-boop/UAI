<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCADE PORTFOLIO | Taller de Interfaces</title>
    <!-- Fuente Pixel retro estilo Arcade -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff0055;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffe600;
            --bg-dark: #0d0221;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            /* Rejilla retro de fondo */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Efecto de líneas CRT de televisor antiguo */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .cabinet {
            border: 4px solid var(--neon-cyan);
            padding: 40px 30px;
            background: rgba(13, 2, 33, 0.9);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 15px var(--neon-cyan);
            border-radius: 12px;
            max-width: 850px;
            width: 100%;
        }

        h1 {
            color: var(--neon-pink);
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 3px 3px var(--neon-cyan), 0 0 10px var(--neon-pink);
            line-height: 1.4;
        }

        .subtitle {
            color: var(--neon-yellow);
            font-size: 0.75rem;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .insert-coin {
            font-size: 0.7rem;
            color: #ffffff;
            margin-bottom: 30px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn-arcade {
            display: block;
            width: 100%;
            max-width: 600px;
            padding: 18px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            text-decoration: none;
            background: #000000;
            border: 3px solid var(--neon-cyan);
            border-radius: 4px;
            transition: all 0.2s ease;
            box-shadow: 5px 5px 0px var(--neon-pink);
            text-transform: uppercase;
            line-height: 1.5;
        }

        .btn-arcade:hover {
            background: var(--neon-cyan);
            color: #000000;
            box-shadow: 5px 5px 0px #ffffff;
            transform: translate(-2px, -2px);
        }

        .footer-retro {
            margin-top: 40px;
            font-size: 0.55rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="cabinet">
        <h1>TALLER DE INTERFACES</h1>
        <div class="subtitle">--- PORTAFOLIO DIGITAL ---</div>
        
        <div class="insert-coin">INSERT COIN TO SELECT LEVEL</div>

        <div class="menu-grid">
            <a class="btn-arcade" href="./entrega1/">STAGE 1: ELECTRODOMÉSTICO</a>
            <a class="btn-arcade" href="./entrega2/">STAGE 2: EXP. SONORA</a>
            <a class="btn-arcade" href="./entrega3/">STAGE 3: MAX / MSP</a>
            <a class="btn-arcade" href="./entrega4/">STAGE 4: SONIFICACIÓN</a>
        </div>

        <div class="footer-retro">
            © 2026 UAI - HIGH SCORE: 999990
        </div>
    </div>

</body>
</html>
